openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Nexo AI chat
  - name: agent
    description: Nexo Agent
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: streamChat
      tags: [chat]
      summary: Stream an AI chat response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Server-sent JSON events containing final-answer content, separate reasoning deltas returned by Groq when supported, activity with id/label/kind/status, sources, model metadata, notice with id/message/model for fallbacks, done, or error. Reasoning is the provider-exposed trace, not a generated summary or a claim of access to unexposed internals. Web search is external and selective.
          content:
            text/event-stream: {}
        "400":
          description: Invalid conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Groq is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Groq rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat/image:
    post:
      operationId: streamImageChat
      tags: [chat]
      summary: Stream an image-aware AI chat response
      description: Image-bearing prompts use the server-side Gemini API route. Text-only prompts continue through the existing Groq route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageChatInput"
      responses:
        "200":
          description: Server-sent JSON events containing answer text, activity, model metadata, done, or error.
          content:
            text/event-stream: {}
        "400":
          description: Invalid conversation or image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Image request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gemini service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /agent:
    post:
      operationId: streamAgentChat
      tags: [agent]
      summary: Stream an Agent-mode response
      description: Gemini can analyze an optional image, then selectively request external web search or browser-only code execution. Tool activity, sources, generated code, and bounded results are returned as SSE events; private model reasoning and image bytes are not exposed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatInput"
      responses:
        "200":
          description: Server-sent JSON events containing answer text, tool activity, sources, a browser code request, completion, or a safe error.
          content:
            text/event-stream: {}
        "400":
          description: Invalid conversation or tool history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Agent image request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gemini or an Agent tool failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    ChatInput:
      type: object
      properties:
        deepthink:
          type: boolean
          default: false
          description: Use high reasoning effort instead of medium
        timeZone:
          type: string
          maxLength: 100
          description: Browser IANA timezone, validated by the server for current-time context
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages
    ImageChatInput:
      type: object
      properties:
        deepthink:
          type: boolean
          default: false
          description: Use high Gemini thinking level instead of medium
        timeZone:
          type: string
          maxLength: 100
          description: Browser IANA timezone, validated by the server for current-time context
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
        image:
          $ref: "#/components/schemas/ImageAttachment"
      required:
        - messages
        - image
    ImageAttachment:
      type: object
      properties:
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        data:
          type: string
          minLength: 4
          maxLength: 4194304
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
          description: Base64-encoded image bytes without a data URL prefix
      required:
        - mimeType
        - data
    AgentChatInput:
      type: object
      properties:
        deepthink:
          type: boolean
          default: false
          description: Use high Gemini thinking level instead of medium
        timeZone:
          type: string
          maxLength: 100
          description: Browser IANA timezone, validated by the server for current-time context
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
        agentHistory:
          type: array
          maxItems: 6
          description: Bounded prior tool call and result pairs for the current turn, including Gemini's opaque continuation signature.
          items:
            $ref: "#/components/schemas/AgentToolExchange"
        image:
          $ref: "#/components/schemas/ImageAttachment"
      required:
        - messages
    AgentToolExchange:
      type: object
      properties:
        tool:
          type: string
          enum: [web_search, run_code]
        callId:
          type: string
          minLength: 1
          maxLength: 128
        thoughtSignature:
          type: string
          minLength: 1
          maxLength: 4096
        arguments:
          $ref: "#/components/schemas/AgentToolArguments"
        result:
          type: string
          maxLength: 8000
        sources:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AgentSource"
      required:
        - tool
        - callId
        - thoughtSignature
        - arguments
        - result
    AgentToolArguments:
      type: object
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 300
        language:
          type: string
          enum: [python, javascript, html]
        code:
          type: string
          minLength: 1
          maxLength: 20000
      additionalProperties: false
    AgentSource:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        url:
          type: string
          format: uri
          maxLength: 2048
      required:
        - title
        - url
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

