openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Groq-powered Nexo AI chat
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: streamChat
      tags: [chat]
      summary: Stream an AI chat response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Server-sent JSON events containing final-answer content, separate reasoning deltas returned by Groq when supported, activity with id/label/kind/status, sources, model metadata, notice with id/message/model for fallbacks, done, or error. Reasoning is the provider-exposed trace, not a generated summary or a claim of access to unexposed internals. Web search is external and selective.
          content:
            text/event-stream: {}
        "400":
          description: Invalid conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Groq is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Groq rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    ChatInput:
      type: object
      properties:
        deepthink:
          type: boolean
          default: false
          description: Use high reasoning effort instead of medium
        timeZone:
          type: string
          maxLength: 100
          description: Browser IANA timezone, validated by the server for current-time context
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

