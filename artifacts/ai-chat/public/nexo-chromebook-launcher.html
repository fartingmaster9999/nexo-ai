<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <meta http-equiv="refresh" content="1; url=https://nexo-ai-tawny.vercel.app/" />
    <title>Open Nexo AI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b12; color: #f4f7fb; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 35%, #102344 0, #080b12 52%); }
      main { width: min(100%, 440px); padding: 36px 28px; border: 1px solid #202a3b; border-radius: 22px; background: rgba(11, 15, 23, .92); box-shadow: 0 28px 90px rgba(0, 0, 0, .38); text-align: center; }
      .brand { margin: 0 0 24px; font-size: 15px; font-weight: 700; letter-spacing: .12em; }
      .brand span { color: #3988ff; }
      h1 { margin: 0; font-size: clamp(25px, 7vw, 34px); letter-spacing: -.04em; }
      p { margin: 12px 0 24px; color: #a7b1c2; font-size: 14px; line-height: 1.6; }
      a { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px; border-radius: 999px; color: #07111f; background: #3988ff; font-size: 14px; font-weight: 700; text-decoration: none; }
      a:hover { background: #62a0ff; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      small { display: block; margin-top: 18px; color: #79869a; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">NEXO <span>AI</span></div>
      <h1>Opening Nexo AI</h1>
      <p>This Chromebook launcher opens the full Nexo website in Chrome. An internet connection is required.</p>
      <a href="https://nexo-ai-tawny.vercel.app/" rel="noopener">Open Nexo AI</a>
      <small>If the page does not open automatically, select the button above.</small>
    </main>
  </body>
</html>
