<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1422'/%3E%3Cpath d='M17 45V19l30 26V19' fill='none' stroke='%23f7fbff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Nexo AI Launcher</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b12;
        color: #f4f7fb;
      }
      * { box-sizing: border-box; }
      body { min-width: 280px; min-height: 100vh; min-height: 100dvh; margin: 0; }
      [hidden] { display: none !important; }
      .launcher {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 35%, #102344 0, #080b12 52%);
      }
      .card {
        width: min(100%, 400px);
        padding: 34px 28px;
        border: 1px solid #202a3b;
        border-radius: 22px;
        background: rgba(11, 15, 23, .94);
        box-shadow: 0 28px 90px rgba(0, 0, 0, .38);
        text-align: center;
      }
      .brand { margin: 0 0 22px; font-size: 14px; font-weight: 700; letter-spacing: .12em; }
      .brand span { color: #3988ff; }
      h1 { margin: 0; font-size: clamp(25px, 7vw, 32px); letter-spacing: -.04em; }
      p { margin: 12px 0 24px; color: #a7b1c2; font-size: 14px; line-height: 1.6; }
      button {
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 999px;
        color: #07111f;
        background: #3988ff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #62a0ff; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      #status { min-height: 18px; margin: 16px 0 0; color: #a7b1c2; font-size: 12px; }
      .app-window { width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #080b12; }
      .app-header {
        height: 42px;
        flex: 0 0 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        border-bottom: 1px solid #1b2432;
        background: #0a0d14;
        color: #edf3ff;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: .01em;
      }
      .app-header button {
        width: auto;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid #263348;
        color: #c6d1e1;
        background: #111824;
        font-size: 12px;
        font-weight: 600;
      }
      .app-header button:hover { background: #1a2638; }
      iframe { display: block; width: 100%; flex: 1; border: 0; background: #080b12; }
    </style>
  </head>
  <body>
    <main class="launcher" id="launcher">
      <section class="card" aria-labelledby="heading">
        <div class="brand">NEXO <span>AI</span></div>
        <h1 id="heading">Open Nexo in a window</h1>
        <p>Opens Nexo AI in a separate browser window. An internet connection is required.</p>
        <button id="open-window" type="button">Open Nexo AI</button>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <section class="app-window" id="app-window" hidden aria-label="Nexo AI window">
      <header class="app-header">
        <span>Nexo AI</span>
        <button id="close-window" type="button">Close window</button>
      </header>
      <iframe
        title="Nexo AI"
        src="https://nexo-ai-tawny.vercel.app/"
        allow="microphone; camera; autoplay; clipboard-read; clipboard-write"
        allowfullscreen
      ></iframe>
    </section>

    <script>
      const launcher = document.getElementById("launcher");
      const appWindow = document.getElementById("app-window");
      const status = document.getElementById("status");
      const isNexoWindow = window.location.hash === "#nexo-window";

      if (isNexoWindow) {
        launcher.hidden = true;
        appWindow.hidden = false;
        document.title = "Nexo AI";
      }

      document.getElementById("open-window").addEventListener("click", () => {
        const popupUrl = new URL(window.location.href);
        popupUrl.hash = "nexo-window";
        const popup = window.open(
          popupUrl.href,
          "NexoAIWindow",
          "popup=yes,width=1280,height=850"
        );

        if (!popup) {
          status.textContent = "The browser blocked the new window. Allow pop-ups for this launcher, then try again.";
          return;
        }

        popup.focus();
        status.textContent = "Nexo AI opened in a separate window.";
      });

      document.getElementById("close-window").addEventListener("click", () => {
        window.close();
      });
    </script>
  </body>
</html>
