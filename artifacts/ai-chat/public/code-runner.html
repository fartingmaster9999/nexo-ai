<!doctype html>
<html><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net; worker-src blob:; img-src data: blob:; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; frame-src 'none'">
<title>Isolated Nexo code runner</title>
</head><body>
<script id="worker-source" type="text/plain">
const send = (kind, text, dataUrl) => postMessage({type:'output', output:{kind,text,dataUrl}});
const format = (value) => {
  if (typeof value === 'string') return value;
  try { return JSON.stringify(value, null, 2) ?? String(value); } catch { return String(value); }
};
self.onmessage = async ({data}) => {
  const {language, code} = data;
  try {
    if (language === 'python') {
      send('status', 'Loading Python and scientific libraries. First run can take a little longer…');
      importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');
      const pyodide = await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});
      pyodide.setStdout({batched: text => send('stdout',text)});
      pyodide.setStderr({batched: text => send('stderr',text)});
      await pyodide.loadPackage(['numpy','scipy','matplotlib']);
      await pyodide.loadPackagesFromImports(code);
      await pyodide.runPythonAsync('import numpy as np\nimport scipy\nimport matplotlib\nmatplotlib.use("Agg")\nimport matplotlib.pyplot as plt');
      send('status', 'Running Python…');
      const result = await pyodide.runPythonAsync(code);
      if (result !== undefined && result !== null) send('stdout',String(result));
      result?.destroy?.();
      pyodide.globals.set('_nexo_emit_plot', value => send('image', undefined, value));
      await pyodide.runPythonAsync(`
import io as _io, base64 as _base64
for _number in plt.get_fignums():
    _buffer = _io.BytesIO()
    plt.figure(_number).savefig(_buffer, format="png", bbox_inches="tight", dpi=100)
    _nexo_emit_plot("data:image/png;base64," + _base64.b64encode(_buffer.getvalue()).decode())
plt.close("all")
`);
    } else if (language === 'javascript') {
      send('status','Loading JavaScript libraries…');
      importScripts('https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js');
      importScripts('https://cdn.jsdelivr.net/npm/mathjs@14.8.1/lib/browser/math.js');
      const consoleProxy = {
        log:(...args)=>send('stdout',args.map(format).join(' ')),
        info:(...args)=>send('stdout',args.map(format).join(' ')),
        warn:(...args)=>send('stderr',args.map(format).join(' ')),
        error:(...args)=>send('stderr',args.map(format).join(' ')),
        table:(...args)=>send('stdout',args.map(format).join('\n')),
      };
      self.console = consoleProxy;
      send('status','Running JavaScript…');
      const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
      const value = await new AsyncFunction('_','math','console',code)(self._,self.math,consoleProxy);
      if(value !== undefined) send('stdout',format(value));
    } else throw new Error('This language cannot run in the browser sandbox.');
    postMessage({type:'done'});
  } catch(error) {
    const message = error instanceof Error ? error.message : String(error);
    send('stderr',message);
    postMessage({type:'done',error:message});
  }
};
</script>
<script>
let worker;
let currentRun;
window.addEventListener('message', (event) => {
  if (event.source !== parent) return;
  const data = event.data;
  if (data?.type === 'stop' && data.runId === currentRun) { worker?.terminate(); return; }
  if (data?.type !== 'run' || typeof data.runId !== 'string' || typeof data.code !== 'string') return;
  worker?.terminate();
  currentRun = data.runId;
  const blob = new Blob([document.getElementById('worker-source').textContent],{type:'text/javascript'});
  const url = URL.createObjectURL(blob);
  worker = new Worker(url);
  URL.revokeObjectURL(url);
  worker.onmessage = ({data: output}) => parent.postMessage({...output,runId:currentRun},'*');
  worker.onerror = () => parent.postMessage({type:'done',error:'The code sandbox failed to start. Check your connection and try again.',runId:currentRun},'*');
  worker.postMessage({language:data.language,code:data.code});
});
</script>
</body></html>
