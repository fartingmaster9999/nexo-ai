kind = "web"
previewPath = "/"
title = "Nexo AI"
description = "Nexo AI: Groq-hosted GPT-OSS for standard chat, with optional Gemini image understanding and Agent mode."
version = "1.0.0"
id = "artifacts/ai-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25374

[services.development]
run = "pnpm --filter @workspace/ai-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25374"
BASE_PATH = "/"
