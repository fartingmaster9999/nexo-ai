kind = "video"
previewPath = "/nexo-agent-reveal/"
title = "Nexo Agent Reveal"
description = "A widescreen animated reveal film introducing Nexo Agent, built around the supplied splash screen and launch clip."
version = "1.0.0"
id = "artifacts/nexo-agent-reveal"
router = "path"
videoAspectRatio = "16:9"

[[services]]
name = "web"
paths = [ "/nexo-agent-reveal/" ]
localPort = 25781

[services.development]
run = "pnpm --filter @workspace/nexo-agent-reveal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexo-agent-reveal", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexo-agent-reveal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25781"
BASE_PATH = "/nexo-agent-reveal/"
